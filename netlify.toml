# Netlify: เว็บเป็นไฟล์ static ในโฟลเดอร์ web/
# ตอน build จะเขียน web/js/config.js จาก Environment variables SUPABASE_URL / SUPABASE_ANON_KEY
[build]
  publish = "web"
  command = "node scripts/write-config.mjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache"
